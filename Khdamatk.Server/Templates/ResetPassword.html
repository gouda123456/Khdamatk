<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Khadma Hub - Reset Password</title>
    <style>
        body {
            background-color: #f9f9f9;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            padding: 40px;
        }
        .container {
            background: white;
            width: 600px;
            padding: 40px;
            border: 1px solid #E5E7EB;
            border-radius: 8px;
        }
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }
        .logo-rect {
            background: #1A1A1A;
            width: 35px;
            height: 35px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
        }
        .brand-name {
            font-size: 22px;
            font-weight: 600;
            color: #111827;
        }
        h2 {
            font-size: 28px;
            margin: 0 0 10px 0;
            color: #111827;
        }
        p {
            color: #6B7280;
            font-size: 16px;
            margin-bottom: 30px;
        }
        .label {
            font-weight: 500;
            display: block;
            margin-bottom: 12px;
            color: #111827;
        }

        
        .code-input {
            background-color: #D1D5DB; 
            width: 100%;
            height: 85px;
            border: none;
            border-radius: 8px;
            color: #1F2937;
            font-size: 38px;
            font-weight: bold;
            text-align: center; 
            letter-spacing: 10px;
            outline: none; 
            box-sizing: border-box;
        }

        
        .code-input::-webkit-inner-spin-button,
        .code-input::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .footer-text {
            font-size: 14px;
            color: #9CA3AF;
            margin-top: 25px;
            line-height: 1.5;
        }
        .help-footer {
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid #F3F4F6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        .help-link {
            color: #5145CD;
            text-decoration: none;
            font-weight: 600;
        }
        .help-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-rect">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
            </div>
            <span class="brand-name">KHADMA Hub</span>
        </div>

        <h2>Reset Password</h2>
        <p>Use the verification code below to reset your password</p>
        
        <label for="verification_code" class="label">Verification Code</label>
        
        <input type="number" id="verification_code" class="code-input" placeholder="000000">

        <div class="footer-text">
            This code will expire in 15 minutes for security purposes.<br>
            If you didn't request this password reset, please ignore this email.
        </div>

        <div class="help-footer">
            <span style="color: #6B7280;">Need help?</span>
            <a href="#" class="help-link">Contact Support</a>
        </div>
    </div>
</body>
</html>
